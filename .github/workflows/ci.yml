name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: package.json # reads volta.node
                  cache: npm

            # Tests and the build don't need the Electron binary.
            - run: npm ci
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

            - run: npm run format:check
            - run: npm test
            - run: npm run build
