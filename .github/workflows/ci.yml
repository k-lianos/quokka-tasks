name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: package.json # reads volta.node
                  cache: npm

            # Tests and the build don't need the Electron binary.
            - run: npm ci
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

            - run: npm run format:check
            - run: npm test
            - run: npm run build

    # End-to-end tests: Playwright drives the built Electron app (needs the Electron binary and a display).
    # A separate job so `ci` stays fast and keeps the name branch protection requires.
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: package.json # reads volta.node
                  cache: npm

            - run: npm ci
            - run: npm run build
            - run: xvfb-run -a npm run test:e2e # GitHub sets CI=true: one worker, no test.only

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    # The app ships for macOS and Windows too: catch platform-specific breakage before a release.
    # Separate from `ci` so its name, which branch protection requires, stays the same.
    cross-platform:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: package.json # reads volta.node
                  cache: npm

            - run: npm ci
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

            - run: npm test
            - run: npm run build
