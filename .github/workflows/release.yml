name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build the
# .deb and .zip and publish them as a GitHub Release.
on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: package.json # reads volta.node
                  cache: npm

            - name: Check the tag matches package.json
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$version" != "$GITHUB_REF_NAME" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
                      exit 1
                  fi

            - name: Install packaging tools
              run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

            - run: npm ci
            - run: npm test
            - run: npm run make

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  shopt -s globstar
                  gh release create "$GITHUB_REF_NAME" out/make/**/*.deb out/make/**/*.zip --generate-notes
